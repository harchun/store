name: PHP Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP files
        shell: bash
        run: |
          set -e
          files=$(find . -type f -name '*.php' -not -path './vendor/*')
          test -n "$files"
          for file in $files; do
            echo "Checking $file"
            php -l "$file"
          done
